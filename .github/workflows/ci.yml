name: Verify JuaraMetaCorp
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: TypeScript and integration tests
        run: npm test
      - name: Production build
        run: npm run build
